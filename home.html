<script>
document.getElementById('chars').innerHTML = CHARACTERS.map((c) => `
  <a class="char-card" href="wiki.html#${esc(c.id)}">
    <span class="char-face">${media(c.face, 'IMG', c.name)}</span>
    <span><span class="char-name">${esc(c.name)}</span>
    <span class="char-sub">등록번호 ${esc(c.rows[0][1])} · 권한 ✓</span></span>
  </a>`).join('');
</script>

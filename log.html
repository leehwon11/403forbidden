<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글 로그 · 403 Forbidden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbit&family=Silkscreen&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-toast="[‘글 로그’ 를 불러왔습니다.]">
<main class="desk">
  <section class="win wrap pop">
    <div class="win-bar">
      <h1 class="win-title" style="margin:0;font-weight:400">LOG.TXT — /us/LOG</h1>
      <a href="home.html">← 메뉴</a>
    </div>
    <div class="split">
      <nav class="side" aria-label="글 목록">
        <div class="side-head label">ENTRIES</div>
        <div id="list"></div>
      </nav>
      <article class="reader" id="reader" aria-live="polite"></article>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  const list = document.getElementById('list');
  const reader = document.getElementById('reader');
  const unlocked = {};
  let sel = Number(location.hash.replace('#log-', '')) - 1;
  if (!(sel >= 0 && sel < LOGS.length)) sel = 0;
  let wrong = 0;

  const no = (i) => String(i + 1).padStart(3, '0');
  const isLocked = (i) => !!LOGS[i].password && !unlocked[i];

  function renderList() {
    list.innerHTML = LOGS.map((p, i) => {
      const mark = p.password ? (unlocked[i] ? '[열림] ' : '[잠김] ') : '';
      return `<button type="button" class="side-item" data-i="${i}" aria-current="${i === sel}">
        <span>${mark}${esc(p.title)}</span><small>${esc(p.date)}</small></button>`;
    }).join('');
  }

  function navButtons() {
    return `<div class="reader-nav">
      <button type="button" class="btn btn--flat" data-go="-1">← 이전 로그</button>
      <button type="button" class="btn btn--flat" data-go="1">다음 로그 →</button></div>`;
  }

  function renderReader(justOpened) {
    const p = LOGS[sel];
    if (isLocked(sel)) {
      reader.innerHTML = `
        <div class="lockwrap">
          <div class="win lockbox" id="lockbox">
            <div class="win-bar win-bar--deny"><span class="win-title" style="font-size:13px">ACCESS DENIED — 403</span></div>
            <form class="lockbox-body" id="lockform">
              <div>[‘${esc(p.title)}’ 은(는) 잠긴 로그입니다.]<br>[열람하려면 비밀번호가 필요합니다.]</div>
              <label for="pw">비밀번호 · [힌트 자리]</label>
              <input id="pw" type="password" autocomplete="off">
              ${wrong ? '<div class="lockbox-error" role="alert">[비밀번호 불일치 — 접근이 거부되었습니다.]</div>' : ''}
              <button type="submit" class="btn btn--dark btn--flat">요청 보내기</button>
            </form>
          </div>
        </div>${navButtons()}`;
      document.getElementById('lockform').addEventListener('submit', (e) => {
        e.preventDefault();
        if (document.getElementById('pw').value === p.password) {
          unlocked[sel] = true; wrong = 0;
          renderList(); renderReader(true);
        } else {
          wrong++;
          renderReader(false);
          replay(document.getElementById('lockbox'), 'shake');
          document.getElementById('pw').focus();
        }
      });
      return;
    }
    const status = p.password
      ? `<div class="reader-status is-ok">[200 OK — 잠긴 로그 ${no(sel)} 이(가) 열렸습니다.]</div>`
      : `<div class="reader-status">[LOG ${no(sel)} 을(를) 불러왔습니다.]</div>`;
    reader.innerHTML = `${status}
      <h1>${esc(p.title)}</h1>
      <div class="reader-meta">${esc(p.date)} · 시점 ${esc(p.pov)}</div>
      <div class="prose">${p.body.map((t) => `<p>${esc(t)}</p>`).join('')}</div>
      ${navButtons()}`;
    if (justOpened) replay(reader, 'pop');
  }

  function go(i) {
    sel = Math.max(0, Math.min(LOGS.length - 1, i));
    wrong = 0;
    history.replaceState(null, '', '#log-' + (sel + 1));
    renderList(); renderReader(false);
  }

  list.addEventListener('click', (e) => {
    const b = e.target.closest('.side-item');
    if (b) go(Number(b.dataset.i));
  });
  reader.addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]');
    if (b) go(sel + Number(b.dataset.go));
  });

  renderList(); renderReader(false);
})();
</script>
</body>
</html>

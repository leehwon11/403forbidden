<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페어틀 · 403 Forbidden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbit&family=Silkscreen&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-toast="[‘페어틀’ 폴더를 불러왔습니다.]">
<main class="desk">
  <section class="win wrap pop">
    <div class="win-bar">
      <h1 class="win-title" style="margin:0;font-weight:400">IMAGE BACKUP — /us/PAIRFRAME</h1>
      <a href="home.html">← 메뉴</a>
    </div>
    <div class="win-head">
      <div class="tabs" role="group" aria-label="필터">
        <button type="button" class="tab" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" class="tab" data-filter="도훈" aria-pressed="false">도훈</button>
        <button type="button" class="tab" data-filter="해인" aria-pressed="false">해인</button>
        <button type="button" class="tab" data-filter="투샷" aria-pressed="false">투샷</button>
      </div>
      <span id="count" style="font-size:13px;color:var(--muted-2)" aria-live="polite"></span>
    </div>
    <div class="gallery gallery--landscape" id="grid"></div>
    <p class="win-foot" style="margin:0">[틀 출처는 각 항목에 표기 · 틀 제작자님께 감사드립니다.]</p>
  </section>
</main>

<div class="viewer viewer--wide" id="viewer" hidden>
  <div class="win" role="dialog" aria-modal="true" aria-labelledby="v-title">
    <div class="win-bar" style="padding-right:8px">
      <span class="win-title" id="v-title"></span>
      <button type="button" class="viewer-close" aria-label="닫기">X</button>
    </div>
    <div class="viewer-body">
      <div class="viewer-img" id="v-img"></div>
      <div class="viewer-meta">
        <span><span id="v-cap"></span><br><small id="v-note"></small></span>
        <div class="viewer-nav">
          <button type="button" class="btn btn--flat" id="v-prev">← 이전</button>
          <button type="button" class="btn btn--flat" id="v-next">다음 →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
initGallery({
  items: PAIRFRAMES,
  prefix: 'FRAME_',
  caption: (it) => it.title,
  sub: (it) => `${it.tag} · 틀 ${it.maker} · ${it.date}`
});
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN — 403 Forbidden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbit&family=Silkscreen&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
/* layout: fixed header/tabs/footer, scrollable middle */
body{margin:0;overflow:hidden;background:var(--desk)}
.adm-shell{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
  max-width:860px;margin:0 auto;border-left:2px solid var(--ink);border-right:2px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);background:var(--paper)}
.adm-bar{flex:none}
.adm-tabs-wrap{flex:none;border-bottom:2px solid var(--ink);background:var(--paper);padding:0}
.adm-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--sheet,var(--paper))}
.adm-foot{flex:none;display:flex;gap:8px;padding:10px 16px;justify-content:flex-end;flex-wrap:wrap;
  border-top:2px solid var(--ink);background:var(--paper)}

/* form elements */
.adm{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:780px;margin:0 auto;width:100%;box-sizing:border-box}
.adm-row{display:flex;flex-direction:column;gap:4px}
.adm-row>label{font-family:'Silkscreen',monospace;font-size:11px;text-transform:uppercase;color:var(--muted)}
.adm input,.adm textarea,.adm select{
  font-family:'Orbit',sans-serif;font-size:14px;
  border:2px solid var(--ink);padding:6px 8px;
  background:var(--white);color:var(--ink);width:100%;box-sizing:border-box}
.adm textarea{min-height:56px;resize:vertical}
.adm input:focus,.adm textarea:focus,.adm select:focus{outline:2px solid var(--bar);outline-offset:-2px}

/* cards with collapse */
.adm-card{border:2px solid var(--ink);margin-bottom:12px;background:var(--paper);box-shadow:2px 2px 0 var(--ink)}
.adm-card-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
  background:var(--bar);color:var(--paper);cursor:pointer;user-select:none;gap:8px}
.adm-card-head:hover{opacity:.9}
.adm-card-title{font-family:'Silkscreen',monospace;font-size:12px;flex:1}
.adm-card-toggle{font-family:'Silkscreen',monospace;font-size:10px;opacity:.7;flex:none}
.adm-card-body{padding:12px}
.adm-card.collapsed .adm-card-body{display:none}
.adm-card.collapsed .adm-card-toggle::after{content:'OPEN'}
.adm-card:not(.collapsed) .adm-card-toggle::after{content:'FOLD'}

.adm-add{width:100%;border:2px dashed var(--muted);padding:8px;cursor:pointer;font-family:'Orbit',sans-serif;background:none;color:var(--muted)}
.adm-add:hover{border-color:var(--ink);color:var(--ink)}
.adm-rm{font-size:12px;cursor:pointer;background:none;border:1px solid var(--muted);padding:2px 8px;font-family:'Orbit',sans-serif;color:var(--red,#c00);flex:none}
.adm-rm:hover{border-color:var(--red,#c00)}
.adm-sec{font-family:'Silkscreen',monospace;font-size:12px;padding:8px 0;border-bottom:1px solid var(--ink);margin-bottom:8px;color:var(--bar)}
.adm-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.adm-pair{grid-template-columns:1fr}}
.adm-msg{display:grid;grid-template-columns:90px 1fr 80px;gap:4px;align-items:start;margin-bottom:4px}
@media(max-width:600px){.adm-msg{grid-template-columns:1fr}}
.adm-saved{font-size:12px;margin-right:auto;align-self:center;font-family:'Silkscreen',monospace}
.adm-hint{font-size:12px;color:var(--muted);margin-top:-4px}
.adm-inline{display:flex;gap:4px;margin-bottom:4px}
.adm-inline textarea{flex:1}
.adm-conn{font-size:12px;padding:2px 8px;font-family:'Silkscreen',monospace}

/* tab badges */
.tab-badge{font-family:'Silkscreen',monospace;font-size:9px;background:var(--bar);color:var(--paper);
  padding:1px 5px;margin-left:4px;vertical-align:middle}
.tab[aria-pressed="true"] .tab-badge{background:var(--paper);color:var(--bar)}

/* mobile header */
@media(max-width:600px){
  .adm-shell{border:none;box-shadow:none}
  .adm-bar-inner{flex-wrap:wrap;gap:4px}
  .adm-bar-inner .win-title{font-size:12px;width:100%;order:-1}
}
</style>
</head>
<body>
<div class="adm-shell">
  <div class="adm-bar">
    <div class="win-bar adm-bar-inner" style="gap:8px">
      <h1 class="win-title" style="margin:0;font-weight:400">ADMIN — /system/config</h1>
      <span class="adm-conn" id="conn"></span>
      <button type="button" class="btn btn--flat" id="btn-auth" style="font-size:12px;padding:2px 10px">로그인</button>
      <a href="index.html" style="white-space:nowrap">← 사이트</a>
    </div>
  </div>
  <div class="adm-tabs-wrap">
    <div class="tabs" role="group" aria-label="섹션" id="tabs" style="flex-wrap:wrap;padding:6px 12px;gap:4px">
      <button type="button" class="tab" data-tab="site" aria-pressed="true">사이트</button>
      <button type="button" class="tab" data-tab="characters" aria-pressed="false">캐릭터<span class="tab-badge" id="badge-characters"></span></button>
      <button type="button" class="tab" data-tab="commissions" aria-pressed="false">커미션<span class="tab-badge" id="badge-commissions"></span></button>
      <button type="button" class="tab" data-tab="pairframes" aria-pressed="false">페어틀<span class="tab-badge" id="badge-pairframes"></span></button>
      <button type="button" class="tab" data-tab="logs" aria-pressed="false">글 로그<span class="tab-badge" id="badge-logs"></span></button>
      <button type="button" class="tab" data-tab="chats" aria-pressed="false">메신저<span class="tab-badge" id="badge-chats"></span></button>
      <button type="button" class="tab" data-tab="timeline" aria-pressed="false">타임라인<span class="tab-badge" id="badge-timeline"></span></button>
      <button type="button" class="tab" data-tab="boot" aria-pressed="false">부팅/입구</button>
      <button type="button" class="tab" data-tab="terminal" aria-pressed="false">터미널</button>
    </div>
  </div>
  <div class="adm-scroll" id="adm-scroll">
    <div id="ed"></div>
  </div>
  <div class="adm-foot">
    <span class="adm-saved" id="status"></span>
    <button type="button" class="btn btn--dark" id="btn-save" disabled>저장</button>
    <button type="button" class="btn" id="btn-reset">초기화</button>
    <button type="button" class="btn" id="btn-export">data.js 내보내기</button>
  </div>
</div>
<div id="auth-gate" style="position:fixed;inset:0;z-index:9999;background:var(--desk);display:flex;align-items:center;justify-content:center">
  <section class="win" style="width:340px;max-width:90vw">
    <div class="win-bar"><h2 class="win-title" style="margin:0;font-weight:400">ADMIN — AUTH REQUIRED</h2></div>
    <div style="padding:24px;text-align:center;font-size:14px">
      <p style="margin:0 0 8px;font-family:'Silkscreen',monospace;font-size:12px;color:var(--red,#c00)">[403 FORBIDDEN]</p>
      <p style="margin:0 0 16px">[관리자 인증이 필요합니다.]</p>
      <button type="button" class="btn btn--dark" id="gate-login" style="width:100%;padding:8px">[로그인]</button>
      <p style="margin:12px 0 0;font-size:12px;color:var(--muted)"><a href="index.html">← 사이트로 돌아가기</a></p>
    </div>
  </section>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/common.js"></script>
<script>
(async function(){

/* ======== 나루 SDK ======== */
var COLS=['site','characters','commissions','pairframes','logs','chats','timeline','terminal'];
var naru=null,adm=null;
try{
  var mod=await import('https://sdk.naru.pub/sdk/1.0.0/naru.js');
  naru=mod.createNaru();
  adm=await naru.auth.session();
}catch(e){console.warn('Naru SDK:',e.message)}

var gate=document.getElementById('auth-gate');

function hideGate(){if(gate)gate.style.display='none'}
function showGate(){if(gate)gate.style.display=''}

if(adm){hideGate()}

function updateConn(){
  var el=document.getElementById('conn');
  var btn=document.getElementById('btn-auth');
  var save=document.getElementById('btn-save');
  if(adm){
    el.textContent='[DB 연결됨]';el.style.color='var(--green,#0a0)';
    btn.textContent='로그아웃';save.disabled=false;
  }else{
    el.textContent=naru?'[미연결]':'[오프라인]';el.style.color='var(--muted)';
    btn.textContent='로그인';save.disabled=true;
  }
}

async function loadFromNaru(){
  if(!naru)return false;
  try{
    var src=adm||naru;
    var docs=await Promise.all(COLS.map(function(c){
      return src.collection(c).get('config').catch(function(){return null});
    }));
    if(docs[0])D.site=docs[0].data;
    if(docs[1])D.characters=docs[1].data;
    if(docs[2])D.commissions=docs[2].data;
    if(docs[3])D.pairframes=docs[3].data;
    if(docs[4])D.logs=docs[4].data;
    if(docs[5])D.chats=docs[5].data;
    if(docs[6])D.timeline=docs[6].data;
    if(docs[7])D.terminal=docs[7].data;
    persist();return true;
  }catch(e){return false}
}

document.getElementById('btn-auth').addEventListener('click',async function(){
  if(adm){
    await adm.signOut();adm=null;updateConn();showGate();
    showToast('[로그아웃되었습니다.]');
  }else if(naru){
    try{
      await naru.auth.signIn({collections:COLS});
      adm=await naru.auth.session();
      if(adm){
        hideGate();updateConn();
        var ok=await loadFromNaru();
        render();
        showToast(ok?'[로그인 — 데이터를 불러왔습니다.]':'[로그인 — 저장된 데이터가 없습니다. 기본값을 사용합니다.]');
      }
    }catch(e){showToast('[로그인 실패 — '+e.message+']')}
  }else{
    showToast('[나루 SDK를 불러올 수 없습니다.]');
  }
});

document.getElementById('gate-login').addEventListener('click',function(){
  document.getElementById('btn-auth').click();
});

document.getElementById('btn-save').addEventListener('click',async function(){
  if(!adm)return;
  try{
    var keys=['site','characters','commissions','pairframes','logs','chats','timeline','terminal'];
    var vals=[D.site,D.characters,D.commissions,D.pairframes,D.logs,D.chats,D.timeline,D.terminal];
    await adm.batch(keys.map(function(k,i){
      return {collection:k,set:{id:'config',data:vals[i]}};
    }));
    document.getElementById('status').textContent='[DB 저장 완료]';
    document.getElementById('status').style.color='var(--green,#0a0)';
    showToast('[데이터가 저장되었습니다 — 사이트에 바로 반영됩니다.]');
  }catch(e){
    showToast('[저장 실패 — '+(e.code||e.message)+']');
  }
});

/* ======== 데이터 ======== */
var D=JSON.parse(JSON.stringify({
  site:SITE,characters:CHARACTERS,commissions:COMMISSIONS,
  pairframes:PAIRFRAMES,logs:LOGS,chats:CHATS,timeline:TIMELINE,terminal:TERMINAL
}));
try{var sv=localStorage.getItem('admin403');if(sv)D=JSON.parse(sv)}catch(e){}

if(adm){await loadFromNaru()}

function persist(){
  try{localStorage.setItem('admin403',JSON.stringify(D))}catch(e){}
  var st=document.getElementById('status');
  st.textContent='[자동 저장됨]';st.style.color='var(--muted)';
}
function gp(path){return path.split('.').reduce(function(o,k){return o[isNaN(k)?k:+k]},D)}
function sp(path,val){
  var ks=path.split('.'),obj=D;
  for(var i=0;i<ks.length-1;i++) obj=obj[isNaN(ks[i])?ks[i]:+ks[i]];
  obj[isNaN(ks[ks.length-1])?ks[ks.length-1]:+ks[ks.length-1]]=val;
}

function inp(p,ph){var v=gp(p);return '<input data-p="'+p+'" value="'+esc(v==null?'':v)+'" placeholder="'+esc(ph||'')+'">';}
function imgInp(p,ph){var v=gp(p);return '<div style="display:flex;gap:4px"><input data-p="'+p+'" value="'+esc(v==null?'':v)+'" placeholder="'+esc(ph||'')+'" style="flex:1">'+
  (adm?'<button type="button" class="btn btn--flat" data-action="upload" data-target="'+p+'" style="font-size:11px;padding:2px 8px;white-space:nowrap">업로드</button>':'')+'</div>';}
function area(p,ph,r){var v=gp(p);return '<textarea data-p="'+p+'" rows="'+(r||3)+'" placeholder="'+esc(ph||'')+'">'+esc(v==null?'':v)+'</textarea>';}
function sel(p,opts){var v=gp(p);return '<select data-p="'+p+'">'+opts.map(function(o){
  var val=typeof o==='string'?o:o[0],lb=typeof o==='string'?o:o[1];
  return '<option value="'+esc(val)+'"'+(String(val)===String(v)?' selected':'')+'>'+esc(lb)+'</option>';
}).join('')+'</select>';}
function chk(p,lb){var v=gp(p);return '<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" data-p="'+p+'"'+(v?' checked':'')+'>'+esc(lb)+'</label>';}
function rw(lb,html){return '<div class="adm-row"><label>'+esc(lb)+'</label>'+html+'</div>';}

var ed=document.getElementById('ed'),curTab='site';

function updateBadges(){
  var counts={characters:D.characters.length,commissions:D.commissions.length,
    pairframes:D.pairframes.length,logs:D.logs.length,chats:D.chats.length,timeline:D.timeline.length};
  Object.keys(counts).forEach(function(k){
    var el=document.getElementById('badge-'+k);
    if(el)el.textContent=counts[k];
  });
}

function render(){
  var fn={site:rSite,characters:rChars,commissions:rComm,pairframes:rPair,logs:rLogs,chats:rChats,timeline:rTL,boot:rBoot,terminal:rTerm};
  (fn[curTab]||rSite)();
  updateBadges();
  var scroll=document.getElementById('adm-scroll');
  if(scroll)scroll.scrollTop=0;
}

function rSite(){
  ed.innerHTML='<div class="adm">'+
    rw('TITLE',inp('site.title','사이트 제목'))+
    rw('LAST SYNC',inp('site.lastSync','YYYY.MM.DD'))+
    rw('CONTACT',inp('site.contact','방명록 / 연락처 링크'))+
    rw('BOOT INTRO',chk('site.bootIntro','입구 부팅 화면 사용'))+
    '<div class="adm-sec">공지사항</div>'+
    '<p class="adm-hint">[줄바꿈(\\n)으로 문단을 나눌 수 있어요. 빈 문자열이면 공지 모달이 뜨지 않아요.]</p>'+
    rw('BROADCAST (공지사항)',area('site.broadcast','공지사항 내용을 여기에 적어요.',4))+
  '</div>';
}

function rChars(){
  ed.innerHTML='<div class="adm">'+D.characters.map(function(c,ci){
    var p='characters.'+ci;
    return '<div class="adm-card collapsed">'+
      '<div class="adm-card-head" data-action="toggle"><span class="adm-card-title">#'+(ci+1)+' '+esc(c.name)+' ('+esc(c.tag)+')</span><span class="adm-card-toggle"></span></div>'+
      '<div class="adm-card-body">'+
      '<div class="adm-pair">'+rw('ID',inp(p+'.id','id'))+rw('이름',inp(p+'.name','이름'))+'</div>'+
      '<div class="adm-pair">'+rw('TAG',inp(p+'.tag','DREAM / ORIGINAL'))+rw('상대',inp(p+'.other','상대 이름'))+'</div>'+
      '<div class="adm-pair">'+rw('FACE (얼굴 이미지)',imgInp(p+'.face','assets/img/...'))+rw('PORTRAIT (초상 이미지)',imgInp(p+'.portrait','assets/img/...'))+'</div>'+
      '<div class="adm-sec">정보 행</div>'+
      c.rows.map(function(r,ri){
        return '<div class="adm-pair" style="margin-bottom:4px">'+
          '<input data-p="'+p+'.rows.'+ri+'.0" value="'+esc(r[0])+'" placeholder="항목명">'+
          '<div style="display:flex;gap:4px"><input data-p="'+p+'.rows.'+ri+'.1" value="'+esc(r[1])+'" placeholder="값" style="flex:1">'+
          '<button type="button" class="adm-rm" data-action="rm-row" data-ci="'+ci+'" data-ri="'+ri+'">X</button></div></div>';
      }).join('')+
      '<button type="button" class="adm-add" data-action="add-row" data-ci="'+ci+'" style="margin:8px 0">+ 정보 행 추가</button>'+
      rw('특성 (줄바꿈으로 구분)',area(p+'.traits','특성 1\n특성 2',3))+
      rw('관계 메모',area(p+'.relation','관계 메모',3))+
      '<div class="adm-sec">세부 프로필</div>'+
      rw('외형',area(p+'.appearance','키, 인상, 옷차림 등',3))+
      rw('성격',area(p+'.personality','말투, 습관, 가치관 등',3))+
      rw('배경',area(p+'.background','과거, 현재 상황 등',3))+
      '<div class="adm-sec">좋아하는 것</div>'+
      (c.likes||[]).map(function(l,li){
        return '<div class="adm-inline"><input data-p="'+p+'.likes.'+li+'" value="'+esc(l)+'" placeholder="항목 '+(li+1)+'">'+
          '<button type="button" class="adm-rm" data-action="rm-like" data-ci="'+ci+'" data-li="'+li+'">X</button></div>';
      }).join('')+
      '<button type="button" class="adm-add" data-action="add-like" data-ci="'+ci+'" style="margin:4px 0">+ 추가</button>'+
      '<div class="adm-sec">싫어하는 것</div>'+
      (c.dislikes||[]).map(function(d,di){
        return '<div class="adm-inline"><input data-p="'+p+'.dislikes.'+di+'" value="'+esc(d)+'" placeholder="항목 '+(di+1)+'">'+
          '<button type="button" class="adm-rm" data-action="rm-dislike" data-ci="'+ci+'" data-di="'+di+'">X</button></div>';
      }).join('')+
      '<button type="button" class="adm-add" data-action="add-dislike" data-ci="'+ci+'" style="margin:4px 0">+ 추가</button>'+
      '<div class="adm-sec">스포일러</div>'+
      '<p class="adm-hint">[열람 확인 모달 뒤에 표시되는 내용입니다.]</p>'+
      rw('스포일러 내용',area(p+'.spoiler','스포일러 내용',5))+
    '</div></div>';
  }).join('')+'</div>';
}

function rComm(){
  rArr('commissions','커미션',function(p){
    return rw('이미지 경로',imgInp(p+'.src','assets/img/commission/...'))+
      rw('태그',sel(p+'.tag',['해인','도훈','투샷']))+
      '<div class="adm-pair">'+rw('작가명',inp(p+'.artist','작가명'))+rw('날짜',inp(p+'.date','YYYY.MM'))+'</div>'+
      rw('코멘트',inp(p+'.note','코멘트 한 줄'));
  });
}

function rPair(){
  rArr('pairframes','페어틀',function(p){
    return rw('이미지 경로',imgInp(p+'.src','assets/img/pairframe/...'))+
      '<div class="adm-pair">'+rw('태그',sel(p+'.tag',['투샷','해인','도훈']))+rw('제목',inp(p+'.title','페어틀 제목'))+'</div>'+
      '<div class="adm-pair">'+rw('제작자',inp(p+'.maker','제작자'))+rw('날짜',inp(p+'.date','YYYY.MM'))+'</div>'+
      rw('코멘트',inp(p+'.note','코멘트 한 줄'));
  });
}

function rArr(key,label,fields){
  ed.innerHTML='<div class="adm">'+D[key].map(function(item,i){
    var p=key+'.'+i;
    var summary=item.title||item.artist||item.maker||'';
    return '<div class="adm-card collapsed">'+
      '<div class="adm-card-head" data-action="toggle"><span class="adm-card-title">'+esc(label)+' #'+(i+1)+(summary?' — '+esc(summary):'')+'</span>'+
      '<span class="adm-card-toggle"></span></div>'+
      '<div class="adm-card-body">'+
      '<div style="text-align:right;margin-bottom:8px"><button type="button" class="adm-rm" data-action="rm" data-key="'+key+'" data-i="'+i+'">삭제</button></div>'+
      fields(p,item,i)+'</div></div>';
  }).join('')+
  '<button type="button" class="adm-add" data-action="add" data-key="'+key+'">+ '+esc(label)+' 추가</button></div>';
}

function rLogs(){
  ed.innerHTML='<div class="adm">'+D.logs.map(function(item,i){
    var p='logs.'+i;
    return '<div class="adm-card collapsed">'+
      '<div class="adm-card-head" data-action="toggle"><span class="adm-card-title">LOG #'+(i+1)+(item.title?' — '+esc(item.title):'')+'</span>'+
      '<span class="adm-card-toggle"></span></div>'+
      '<div class="adm-card-body">'+
      '<div style="text-align:right;margin-bottom:8px"><button type="button" class="adm-rm" data-action="rm" data-key="logs" data-i="'+i+'">삭제</button></div>'+
      '<div class="adm-pair">'+rw('제목',inp(p+'.title','글 제목'))+rw('날짜',inp(p+'.date','YYYY.MM.DD'))+'</div>'+

ed.addEventListener('click',function(e){
  var b=e.target.closest('[data-action]');if(!b)return;
  var a=b.dataset.action;
  if(a==='toggle'){var card=b.closest('.adm-card');if(card)card.classList.toggle('collapsed');return;}
  if(a==='add'){D[b.dataset.key].push(JSON.parse(JSON.stringify(DEFAULTS[b.dataset.key])));persist();render();}
  if(a==='rm'){if(!confirm('#'+(+b.dataset.i+1)+' 항목을 삭제하시겠습니까?'))return;D[b.dataset.key].splice(+b.dataset.i,1);persist();render();}
  if(a==='add-row'){D.characters[+b.dataset.ci].rows.push(['','']);persist();render();}
  if(a==='rm-row'){D.characters[+b.dataset.ci].rows.splice(+b.dataset.ri,1);persist();render();}
  if(a==='add-para'){D.logs[+b.dataset.li].body.push('');persist();render();}
  if(a==='rm-para'){D.logs[+b.dataset.li].body.splice(+b.dataset.pi,1);persist();render();}
  if(a==='add-msg'){D.chats[+b.dataset.ci].messages.push({from:'haein',text:'',time:''});persist();render();}
  if(a==='rm-msg'){D.chats[+b.dataset.ci].messages.splice(+b.dataset.mi,1);persist();render();}
  if(a==='upload'){
    var target=b.dataset.target;
    var fi=document.createElement('input');fi.type='file';fi.accept='image/*';
    fi.onchange=async function(){
      if(!fi.files[0]||!adm)return;
      try{
        showToast('[이미지를 업로드하고 있습니다…]');
        var res=await adm.media.upload(fi.files[0]);
        sp(target,res.url);persist();render();
        showToast('[업로드 완료 — '+res.name+']');
      }catch(e){showToast('[업로드 실패 — '+(e.message||e)+']')}
    };fi.click();return;
  }
  if(a==='add-like'){if(!D.characters[+b.dataset.ci].likes)D.characters[+b.dataset.ci].likes=[];D.characters[+b.dataset.ci].likes.push('');persist();render();}
  if(a==='rm-like'){D.characters[+b.dataset.ci].likes.splice(+b.dataset.li,1);persist();render();}
  if(a==='add-dislike'){if(!D.characters[+b.dataset.ci].dislikes)D.characters[+b.dataset.ci].dislikes=[];D.characters[+b.dataset.ci].dislikes.push('');persist();render();}
  if(a==='rm-dislike'){D.characters[+b.dataset.ci].dislikes.splice(+b.dataset.di,1);persist();render();}
  if(a==='add-boot'){if(!D.site.boot)D.site.boot=[];D.site.boot.push({text:'',cls:'',wait:500});persist();render();}
  if(a==='rm-boot'){D.site.boot.splice(+b.dataset.i,1);persist();render();}
  if(a==='add-knock'){if(!D.site.knock)D.site.knock=[];D.site.knock.push('');persist();render();}
  if(a==='rm-knock'){D.site.knock.splice(+b.dataset.i,1);persist();render();}
  if(a==='add-wait'){if(!D.site.waitSteps)D.site.waitSteps=[];D.site.waitSteps.push({text:'',wait:500});persist();render();}
  if(a==='rm-wait'){D.site.waitSteps.splice(+b.dataset.i,1);persist();render();}
  if(a==='add-term'){if(!D.terminal)D.terminal={};var tk=b.dataset.key;if(!D.terminal[tk])D.terminal[tk]=[];D.terminal[tk].push({text:'',cls:''});persist();render();}
  if(a==='rm-term'){if(D.terminal&&D.terminal[b.dataset.key])D.terminal[b.dataset.key].splice(+b.dataset.i,1);persist();render();}
});
